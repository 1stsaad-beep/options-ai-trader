# Standalone only: never merge with an existing Compose project or Demo volume.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phone_lab
      POSTGRES_DB: options_phone_lab
      POSTGRES_PASSWORD: ${PHONE_LAB_DB_PASSWORD:?Use scripts/phone_lab.py init}
    volumes:
      - phone_lab_data:/var/lib/postgresql/data
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U phone_lab -d options_phone_lab']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: 'no'
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: [uvicorn, 'app.phone_lab:create_phone_app', --factory, --host, 0.0.0.0, --port, '8000', --no-access-log]
    environment: &safe_environment
      DATABASE_URL: postgresql://phone_lab:${PHONE_LAB_DB_PASSWORD}@postgres:5432/options_phone_lab
      OPTIONS_API_TOKEN: ${PHONE_LAB_API_TOKEN:?Use scripts/phone_lab.py init}
      OAT_PHONE_LAB: isolated_mock_only
      TRADING_MODE: paper
      BROKER_PROVIDER: mock
      ENABLE_LIVE: 'false'
      OAT_MARKET_RUNTIME_ROLE: api_cache_only
      OAT_ALPACA_DATA_APPROVAL: ''
    networks: [isolated]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/phone-lab', timeout=3).read()"]
      interval: 3s
      timeout: 5s
      retries: 30
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: 'no'
  market-runtime:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: [python, -m, app.phone_lab]
    environment:
      <<: *safe_environment
      OPTIONS_API_TOKEN: ''
    networks: [isolated]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, app.phone_lab, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: 'no'
  gateway:
    image: caddy:2-alpine
    user: '10001:10001'
    ports: ['127.0.0.1:18019:8080']
    networks: [isolated, ingress]
    volumes:
      - ./Caddyfile.phone-lab:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/phone-lab']
      interval: 3s
      timeout: 5s
      retries: 30
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777', '/config:size=1m,mode=1777', '/data:size=1m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: 'no'

networks:
  ingress:
    driver: bridge
  isolated:
    internal: true
volumes:
  phone_lab_data:
