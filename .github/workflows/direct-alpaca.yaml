name: Direct Alpaca mock acceptance
on:
  push:
    branches: [recovery/v1.0-20261011]
    paths: ['mobile/**', '.github/workflows/direct-alpaca.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: direct-alpaca-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python3 mobile/scripts/test_alpaca_policy.py > alpaca-policy.txt
      - run: bash scripts/bootstrap.sh
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --exclude-tags=golden --machine > direct-flutter-tests.json
        working-directory: mobile
      - name: Native HTTP and WebSocket mock tests (no provider network)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-alpaca-mock-results
          path: |
            alpaca-policy.txt
            mobile/direct-flutter-tests.json
            mobile/classic-preview-*.png
            mobile/build/app/test-results/**
          retention-days: 14
