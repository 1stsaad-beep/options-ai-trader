name: Mock safety checks
on:
  push:
    paths: ["backend/**", "scripts/**", "infra/**", "mobile/scripts/prepare_ci_signing.py", ".github/workflows/checks.yaml"]
  pull_request:
    paths: ["backend/**", "scripts/**", "infra/**", "mobile/scripts/prepare_ci_signing.py", ".github/workflows/checks.yaml"]
  workflow_dispatch:
env:
  CI: "true"
  BOT: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: ci_ephemeral_demo
          POSTGRES_DB: options_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trader -d options_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e './backend[test]'
      - run: python -m pytest -q --junitxml=../test-results.xml
        working-directory: backend
      - name: Local HTTP API and independent worker smoke
        run: python scripts/smoke_http.py > http-smoke.json
      - name: Deterministic Mock lifecycle scenarios
        run: python scripts/demo_lifecycle.py > lifecycle-synthetic.json
      - run: python scripts/postgres_check.py > postgres-basic.txt
        env:
          TEST_DATABASE_ALLOW_DISPOSABLE: "1"
          TEST_DATABASE_URL: postgresql://trader:ci_ephemeral_demo@localhost:5432/options_test
      - run: python scripts/postgres_v1_check.py > postgres-v1-results.json
        env:
          TEST_DATABASE_ALLOW_DISPOSABLE: "1"
          TEST_DATABASE_URL: postgresql://trader:ci_ephemeral_demo@localhost:5432/options_test
      - name: Immutable market journal across PostgreSQL connections
        run: python scripts/market_data_journal_check.py > market-data-journal-postgres.json
        env:
          TEST_DATABASE_ALLOW_DISPOSABLE: "1"
          TEST_DATABASE_URL: postgresql://trader:ci_ephemeral_demo@localhost:5432/options_test
      - name: Select matching PostgreSQL 16 backup client
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Restore a verified backup to a new disposable database
        run: python scripts/postgres_backup_check.py > postgres-backup-restore.json
        env:
          TEST_DATABASE_ALLOW_DISPOSABLE: "1"
          TEST_DATABASE_URL: postgresql://trader:ci_ephemeral_demo@localhost:5432/options_test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: |
            test-results.xml
            http-smoke.json
            lifecycle-synthetic.json
            postgres-backup-restore.json
            postgres-basic.txt
            postgres-v1-results.json
            market-data-journal-postgres.json
  compose-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Disposable base Compose API worker and PostgreSQL smoke
        run: python scripts/compose_smoke.py --run > compose-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compose-runtime-result
          path: compose-smoke.json
          if-no-files-found: error
          retention-days: 14
