name: iOS V1.0 RC2 unsigned review build
on:
  push:
    branches: [main, develop/v1.0, develop/v1.0-rc2, recovery/v1.0-20261011]
    paths: ["mobile/**", ".github/workflows/ios.yaml"]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Reverse DNS bundle identifier
        default: com.optionsaitrader.optionsAiTrader
        required: true
env:
  CI: "true"
  BOT: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    if: ${{ !contains(github.event.head_commit.message, '[chart-check]') }}
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      IOS_BUNDLE_ID: ${{ inputs.bundle_id || 'com.optionsaitrader.optionsAiTrader' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: bash scripts/bootstrap.sh
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --exclude-tags=golden --machine > flutter-tests.json
        working-directory: mobile
      - run: flutter build ios --release --no-codesign --build-name=1.0.0 --build-number=14
        working-directory: mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: options-ai-trader-v1.0-rc2-ios-unsigned
          path: |
            mobile/build/ios/iphoneos/Runner.app
            mobile/flutter-tests.json
          retention-days: 14
