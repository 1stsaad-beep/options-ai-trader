name: Source and dependency security checks
on:
  push:
    branches: [main, develop/v1.0]
    paths: ["backend/**", "mobile/**", "scripts/**", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/security_scan.py --repository . --all-history > secret-scan.json
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.lock --no-deps --disable-pip --format json --output dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v1-security-results
          path: |
            secret-scan.json
            dependency-audit.json
          retention-days: 14
