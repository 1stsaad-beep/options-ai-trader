name: V1 source and history checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive committed source and complete Git history
        run: |
          git archive --format=zip --prefix=options-ai-trader/ -o options-ai-trader-source.zip HEAD
          git bundle create options-ai-trader-history.bundle --all HEAD
          git bundle verify options-ai-trader-history.bundle
          sha256sum options-ai-trader-source.zip options-ai-trader-history.bundle > checkpoint.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: options-ai-trader-v1-checkpoint
          path: |
            options-ai-trader-source.zip
            options-ai-trader-history.bundle
            checkpoint.sha256
          retention-days: 30
