name: Android V1.0 RC2 offline demo
on:
  push:
    branches: [main, develop/v1.0, develop/v1.0-rc2, recovery/v1.0-20261011]
    paths: ["mobile/**", ".github/workflows/android.yaml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yaml"]
  workflow_dispatch:
env:
  CI: "true"
  BOT: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    if: ${{ !contains(github.event.head_commit.message, '[chart-check]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.sh
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --exclude-tags=golden --machine > flutter-tests.json
        working-directory: mobile
      - name: Compare reviewed chart golden baselines
        run: flutter test --tags=golden --machine > golden-tests.json
        working-directory: mobile
      - name: Prepare private development key when available
        run: python mobile/scripts/prepare_ci_signing.py
        env:
          OAT_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.OAT_KEYSTORE_BASE64 || '' }}
          OAT_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.OAT_KEYSTORE_PASSWORD || '' }}
          OAT_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.OAT_KEY_ALIAS || '' }}
          OAT_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.OAT_KEY_PASSWORD || '' }}
      - name: Build separately identified development preview
        run: flutter build apk --debug --build-name=1.0.0 --build-number=15
        working-directory: mobile
        env:
          OAT_UNSIGNED_BUILD: "false"
          OAT_PREVIEW_BUILD: "true"
          OAT_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.OAT_KEYSTORE_PASSWORD || '' }}
          OAT_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.OAT_KEY_ALIAS || '' }}
          OAT_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.OAT_KEY_PASSWORD || '' }}
      - name: Verify preview identity signature checksum and provenance
        run: |
          APK=options-ai-trader-rc2-build15-preview.apk
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk "$APK"
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK" > apk-signature.txt
          "$AAPT_BIN" dump badging "$APK" > apk-package.txt
          python mobile/scripts/verify_preview_identity.py apk-package.txt
          sha256sum "$APK" > apk.sha256
          if [ "$OAT_SIGNING_MODE" = 'stable-development' ]; then
            PREVIEW_SIGNING=stable-development
          else
            PREVIEW_SIGNING=ephemeral-runner-development-key
          fi
          printf '%s\n' "commit=${GITHUB_SHA}" "signing=${PREVIEW_SIGNING}" 'application_id=com.optionsaitrader.options_ai_trader.v1previewrc2b15' 'version_code=15' 'installation=separate-from-build14' > build-provenance.txt
          flutter --version > flutter-build-version.txt
      - name: Remove runner signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/options-development.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: options-ai-trader-rc2-build15-android
          path: |
            options-ai-trader-rc2-build15-preview.apk
            apk.sha256
            apk-signature.txt
            apk-package.txt
            build-provenance.txt
            flutter-build-version.txt
            mobile/flutter-tests.json
            mobile/golden-tests.json
            mobile/test/failures/**
          retention-days: 14
