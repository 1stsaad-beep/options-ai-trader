name: Android V1.0 RC2 offline demo
on:
  push:
    branches: [main, develop/v1.0, develop/v1.0-rc2, recovery/v1.0-20261011]
    paths: ["mobile/**", ".github/workflows/android.yaml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yaml"]
  workflow_dispatch:
env:
  CI: "true"
  BOT: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    if: ${{ !contains(github.event.head_commit.message, '[chart-check]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.sh
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --exclude-tags=golden --machine > flutter-tests.json
        working-directory: mobile
      - name: Prepare private development signing or explicit unsigned artifact
        run: python mobile/scripts/prepare_ci_signing.py
        env:
          OAT_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.OAT_KEYSTORE_BASE64 || '' }}
          OAT_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.OAT_KEYSTORE_PASSWORD || '' }}
          OAT_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.OAT_KEY_ALIAS || '' }}
          OAT_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.OAT_KEY_PASSWORD || '' }}
      - run: flutter build apk --debug --build-name=1.0.0 --build-number=14
        working-directory: mobile
        env:
          OAT_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.OAT_KEYSTORE_PASSWORD || '' }}
          OAT_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.OAT_KEY_ALIAS || '' }}
          OAT_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.OAT_KEY_PASSWORD || '' }}
      - name: APK provenance and checksum
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk "options-ai-trader-v1.0-rc2-${OAT_SIGNING_MODE}.apk"
          sha256sum options-ai-trader-v1.0-rc2-*.apk > apk.sha256
          printf '%s\n' "commit=${GITHUB_SHA}" "signing=${OAT_SIGNING_MODE}" > build-provenance.txt
          flutter --version > flutter-build-version.txt
      - name: Build separately identified installable preview when stable key is unavailable
        if: env.OAT_SIGNING_MODE == 'unsigned'
        run: |
          flutter build apk --debug --build-name=1.0.0 --build-number=14
          cp build/app/outputs/flutter-apk/app-debug.apk ../options-ai-trader-v1.0-rc2-preview.apk
          printf '%s\n' 'preview_signing=ephemeral-runner-development-key' 'preview_application_id=com.optionsaitrader.options_ai_trader.v1previewrc2' >> ../build-provenance.txt
        working-directory: mobile
        env:
          OAT_UNSIGNED_BUILD: "false"
          OAT_PREVIEW_BUILD: "true"
      - name: Verify installable artifact signatures and checksums
        run: |
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ "$OAT_SIGNING_MODE" = 'stable-development' ]; then
            "$APKSIGNER_BIN" verify --verbose --print-certs options-ai-trader-v1.0-rc2-stable-development.apk > apk-signature.txt
          else
            "$APKSIGNER_BIN" verify --verbose --print-certs options-ai-trader-v1.0-rc2-preview.apk > apk-signature.txt
          fi
          sha256sum options-ai-trader-v1.0-rc2-*.apk > apk.sha256
      - name: Remove runner signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/options-development.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: options-ai-trader-v1.0-rc2-android-results
          path: |
            options-ai-trader-v1.0-rc2-*.apk
            apk.sha256
            apk-signature.txt
            build-provenance.txt
            flutter-build-version.txt
            mobile/flutter-tests.json
          retention-days: 14
