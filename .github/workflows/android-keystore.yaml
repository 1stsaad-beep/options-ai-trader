name: Android Keystore device acceptance
on:
  push:
    branches: [recovery/v1.0-20261011]
    paths: ['mobile/android/app/src/androidTest/**', 'mobile/android/app/src/main/kotlin/**/AlpacaVault.kt', '.github/workflows/android-keystore.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keystore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.sh
        working-directory: mobile
      - name: Prepare disposable Android 35 emulator
        run: |
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n oat_keystore -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd oat_keystore -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator-start.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          timeout 180 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
      - name: Real Android Keystore tests with mock values only
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon
        working-directory: mobile/android
      - name: Stop disposable emulator
        if: always()
        run: "$ANDROID_HOME/platform-tools/adb emu kill || true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-keystore-device-results
          path: |
            mobile/build/app/outputs/androidTest-results/**
            mobile/build/app/reports/androidTests/**
            emulator-start.log
          retention-days: 14
