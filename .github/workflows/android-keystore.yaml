name: Android Keystore device acceptance
on:
  push:
    branches: [recovery/v1.0-20261011]
    paths: ['mobile/android/app/src/androidTest/**', 'mobile/android/app/src/main/kotlin/**/AlpacaVault.kt', '.github/workflows/android-keystore.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keystore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare disposable Android 28 emulator
        timeout-minutes: 7
        run: |
          # Emulator enforces a 6GiB userdata minimum for API >=24.
          # Allocate it before the Flutter SDK/cache consumes runner disk.
          df -h "$RUNNER_TEMP"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-28;google_apis;x86_64' 'emulator'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/oat-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n oat_keystore -p "$ANDROID_AVD_HOME/oat_keystore.avd" -k 'system-images;android-28;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/oat_keystore.avd/config.ini"
          python3 - <<'PYCONFIG'
          import os
          from pathlib import Path
          p = Path(os.environ['ANDROID_AVD_HOME']) / 'oat_keystore.avd/config.ini'
          rows = [line for line in p.read_text().splitlines() if line.split('=', 1)[0].strip() not in ('disk.dataPartition.size', 'hw.ramSize')]
          p.write_text('\n'.join(rows + ['disk.dataPartition.size=6G', 'hw.ramSize=2048']) + '\n')
          PYCONFIG
          printf 'avd.ini.encoding=UTF-8\ntarget=android-28\npath=%s\n' "$ANDROID_AVD_HOME/oat_keystore.avd" > "$ANDROID_AVD_HOME/oat_keystore.ini"
          cat "$ANDROID_AVD_HOME/oat_keystore.ini"
          "$ANDROID_HOME/emulator/emulator" -avd oat_keystore -memory 2048 -no-metrics -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator-start.log 2>&1 &
          timeout 180 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat emulator-start.log; exit 1; }
          timeout 180 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.sh
        working-directory: mobile
      - name: Real Android Keystore tests with mock values only
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon
        working-directory: mobile/android
      - name: Stop disposable emulator
        if: always()
        run: "$ANDROID_HOME/platform-tools/adb emu kill || true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-keystore-device-results
          path: |
            mobile/build/app/outputs/androidTest-results/**
            mobile/build/app/reports/androidTests/**
            emulator-start.log
          retention-days: 14
