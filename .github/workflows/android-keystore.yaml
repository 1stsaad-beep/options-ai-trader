name: Android Keystore device acceptance
on:
  push:
    branches: [recovery/v1.0-20261011]
    paths: ['mobile/android/app/src/androidTest/**', 'mobile/android/app/src/main/kotlin/**/Alpaca*.kt', 'mobile/android/app/src/main/kotlin/**/MainActivity.kt', '.github/workflows/android-keystore.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keystore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OAT_PREVIEW_BUILD: 'true'
      OAT_UNSIGNED_BUILD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.sh
        working-directory: mobile
      - name: Compile signed target and instrumentation without emulator disk use
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon -Ptarget-platform=android-x64
        working-directory: mobile/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keystore-instrumented-apks
          path: |
            mobile/build/app/outputs/apk/debug/app-debug.apk
            mobile/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
  emulator:
    needs: build_tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: keystore-instrumented-apks
          path: instrumented-apks
      - name: Prepare disposable Android 28 emulator without Flutter or Gradle caches
        timeout-minutes: 7
        run: |
          df -h "$RUNNER_TEMP"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-28;google_apis;x86_64' 'emulator'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/oat-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n oat_keystore -p "$ANDROID_AVD_HOME/oat_keystore.avd" -k 'system-images;android-28;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/oat_keystore.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\ntarget=android-28\npath=%s\n' "$ANDROID_AVD_HOME/oat_keystore.avd" > "$ANDROID_AVD_HOME/oat_keystore.ini"
          "$ANDROID_HOME/emulator/emulator" -avd oat_keystore -memory 2048 -no-metrics -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator-start.log 2>&1 &
          timeout 180 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat emulator-start.log; exit 1; }
          timeout 180 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          test "$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.build.version.sdk | tr -d "\r")" = '28'
          test "$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.kernel.qemu | tr -d "\r")" = '1'
      - name: Real Android Keystore tests with mock values only
        timeout-minutes: 4
        run: |
          "$ANDROID_HOME/platform-tools/adb" install instrumented-apks/debug/app-debug.apk
          "$ANDROID_HOME/platform-tools/adb" install instrumented-apks/androidTest/debug/app-debug-androidTest.apk
          "$ANDROID_HOME/platform-tools/adb" shell am instrument -w -r -e class com.optionsaitrader.options_ai_trader.AlpacaVaultDeviceTest com.optionsaitrader.options_ai_trader.v1previewrc2b22.test/androidx.test.runner.AndroidJUnitRunner | tee keystore-instrumentation.txt
          python3 - <<'PYRESULT'
          from pathlib import Path
          import json
          output=Path('keystore-instrumentation.txt').read_text()
          expected={'encryptedRoundTripUsesNonExportableAndroidKey','repeatedSaveHasDifferentIvAndCiphertext','modifiedCiphertextFailsClosed','backupDisabledAndMonitorCannotBeStartedByExternalApp','monitoringRequiresExplicitActiveSession','savedStatusSurvivesNewVaultWithoutReturningSecrets','tamperedStorageIsReportedUnreadable','storedSettingsSurviveRecreationWithoutAutomaticConnection','secureStorageSettingsAndSessionIntegrateOverMockDataTransport','runtimeIsSharedAcrossActivityAndApplicationContexts','actualActivityScreenSleepWakeResumesOneMockSession','paperDiskCompareAndSwapSurvivesNewInstance','paperDiskInterruptedWriteRecoversOriginalWithoutInventingLedger'}
          passed=set(); current=None
          for line in output.splitlines():
              if line.startswith('INSTRUMENTATION_STATUS: test='): current=line.split('=',1)[1].strip()
              if line.strip()=='INSTRUMENTATION_STATUS_CODE: 0' and current: passed.add(current)
          assert 'OK (13 tests)' in output and passed==expected, output
          assert not any(x in output for x in ['FAILURES!!!','INSTRUMENTATION_FAILED','shortMsg=','Process crashed']), output
          Path('keystore-result.json').write_text(json.dumps({'status':'passed','api_level':28,'emulator':True,'tests':13,'passed':sorted(passed),'real_credentials':False,'provider_connection':False},indent=2)+'\n')
          PYRESULT
      - name: Stop disposable emulator
        if: always()
        run: "$ANDROID_HOME/platform-tools/adb emu kill || true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-keystore-device-results
          path: |
            keystore-instrumentation.txt
            keystore-result.json
            emulator-start.log
          retention-days: 14
