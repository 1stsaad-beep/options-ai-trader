name: Direct Alpaca mock acceptance
on:
  push:
    branches: [recovery/v1.0-20261011]
    paths: ["mobile/**", ".github/workflows/alpaca-direct.yaml"]
permissions:
  contents: read
jobs:
  native-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap.sh
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: mobile/android
      - name: Flutter direct data mocks when available
        run: if [ -f test/alpaca_direct_test.dart ]; then flutter test test/alpaca_direct_test.dart --machine > alpaca-direct-tests.json; fi
        working-directory: mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alpaca-direct-mock-evidence
          path: |
            mobile/build/app/test-results/testDebugUnitTest/**
            mobile/build/app/reports/tests/**
            mobile/alpaca-direct-tests.json
          retention-days: 14
