name: V1 isolated test toolchain
on:
  push:
    branches: [develop/v1.0]
    paths: [".github/workflows/v1-toolchain.yaml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter precache --linux
      - run: flutter pub get
        working-directory: mobile
      - name: Package test SDK and dependency cache without signing material
        run: |
          mkdir -p toolchain
          cp -a "$FLUTTER_ROOT" toolchain/flutter
          cp -a "$HOME/.pub-cache" toolchain/pub-cache
          flutter --version > toolchain/version.txt
          tar -czf flutter-test-toolchain.tar.gz -C toolchain .
          sha256sum flutter-test-toolchain.tar.gz > toolchain.sha256
          split -b 400M -d flutter-test-toolchain.tar.gz toolchain-part-
      - uses: actions/upload-artifact@v4
        with:
          name: options-v1-test-toolchain-0
          path: |
            toolchain-part-00
            toolchain.sha256
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: options-v1-test-toolchain-1
          path: |
            toolchain-part-01
            toolchain.sha256
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: options-v1-test-toolchain-2
          path: |
            toolchain-part-02
            toolchain.sha256
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: options-v1-test-toolchain-3
          path: |
            toolchain-part-03
            toolchain.sha256
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: options-v1-test-toolchain-4
          path: |
            toolchain-part-04
            toolchain.sha256
          retention-days: 3
